class NetErr extends Error {}               // "no signal": try again later. Anything else is a real answer.
function call(fn, ...args) { return callOp(null, fn, ...args); }
function callOp(op, fn, ...args) {
  if (STANDALONE) {
    if (!navigator.onLine) return Promise.reject(new NetErr("no signal"));
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 45000);
    return fetch(API, { method: "POST", body: JSON.stringify({ k: KEY, fn: fn, args: args, op: op }), signal: ctl.signal, redirect: "follow" })
      .then((r) => r.json().catch(() => { throw new NetErr("Google hiccup (" + r.status + ")"); }), () => { throw new NetErr(navigator.onLine ? "Google is slow" : "no signal"); })
      .then((j) => { if (j.error) throw new Error(j.error); return j.result; })
      .finally(() => clearTimeout(t));
  }
  return new Promise((ok, bad) => {
    google.script.run.withSuccessHandler(ok).withFailureHandler((e) => {
      const msg = e && e.message ? e.message : String(e);
      bad(!navigator.onLine || /network|NetworkError|failed to fetch/i.test(msg) ? new NetErr(msg) : new Error(msg));
    })[fn](...args);
  });
}

function parseHooks(text) {                   // whatever the chat gave him → one hook per line

         .replace(/^(?:hook|idea|option)\s*\d*\s*[:.\-–]\s*/i, "")                  // "Hook 3:"
         .replace(/^\*\*(.+)\*\*$/, "$1").replace(/^["“”'‘’]+|["“”'‘’]+$/g, "").trim();

function todoView() {

  for (const c of q) {
    const find = () => v.tasks.find((x) => (c.task != null && x.id === c.task) || (c.cid && x.cid === c.cid));
    if (c.kind === "tick") { const x = find(); if (x) x.done = c.done; }

    else if (c.kind === "due") { const x = find(); if (x) x.due = c.due; }
