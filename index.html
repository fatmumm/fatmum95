class NetErr extends Error {}               // "no signal": try again later. Anything else is a real answer.
const OFFICE_ONLY = ["deskInbox", "deskThread", "deskReply", "deskSlot", "deskDone", "timeSync", "appRestore", "reviewGet", "deskAct"];   // these live only in the office script
function call(fn, ...args) { return callOp(null, fn, ...args); }
function callOp(op, fn, ...args) {
  if (STANDALONE) {
    if (!navigator.onLine) return Promise.reject(new NetErr("no signal"));
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 45000);
    const url = OFFICE_ONLY.includes(fn) && store.get("office", "") ? store.get("office", "") : API;   // the inbox + date moves live only in the office
    return fetch(url, { method: "POST", body: JSON.stringify({ k: KEY, fn: fn, args: args, op: op }), signal: ctl.signal, redirect: "follow" })
      .then((r) => r.json().catch(() => { throw new NetErr("Google hiccup (" + r.status + ")"); }), () => { throw new NetErr(navigator.onLine ? "Google is slow" : "no signal"); })
      .then((j) => {
        if (j.error && fn === "deskSync" && store.get("api_old", "") && /nope|permission|openById|not have access|unknown/i.test(j.error)) {
          API = store.get("api_old"); store.set("api", API); store.set("api_old", ""); store.set("moveFailed", Date.now());   // back to the old way
          throw new NetErr("switching back");
        }
        if (j.error) throw new Error(j.error); return j.result;
      })
      .finally(() => clearTimeout(t));
  }
  return new Promise((ok, bad) => {
    google.script.run.withSuccessHandler(ok).withFailureHandler((e) => {
      const msg = e && e.message ? e.message : String(e);
      bad(!navigator.onLine || /network|NetworkError|failed to fetch/i.test(msg) ? new NetErr(msg) : new Error(msg));
    })[fn](...args);
  });
}

function applyLocal(r, what, o) {                // what the screen shows straight away
