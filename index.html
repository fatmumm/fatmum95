.tile{padding:8px}.tile .v{font-family:"FMDigits","Pixelify Sans",sans-serif;font-size:22px}.tile .l{font-size:12px;color:#555}.tile .c{font-size:12px}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-bottom:1px solid #e3e3e3}
.task .circ{width:24px;height:24px;border:2px solid;border-radius:50%;flex:none;background:#fff;cursor:pointer;padding:0}
.task .circ.done{background:currentColor}
.task.done .tt{text-decoration:line-through;color:#888}
.task .more{display:none;gap:4px;flex-wrap:wrap;margin-top:6px}.task.open .more{display:flex}
.task .tt{overflow-wrap:anywhere}
#bean{position:fixed;right:16px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:15;display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:min(320px,calc(100vw - 16px))}
#bean canvas{width:64px;height:64px;image-rendering:pixelated;cursor:pointer;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.4))}
.bubble{background:#ffffe1;border:1px solid #000;padding:10px;font-size:14px;box-shadow:2px 2px 0 rgba(0,0,0,.35);position:relative}
.bubble:after{content:"";position:absolute;right:24px;bottom:-9px;border:8px solid transparent;border-top-color:#000;border-bottom:0}
.bubble .bn{font-family:"FMDigits","Pixelify Sans",sans-serif;font-weight:600;color:#000080;margin-bottom:3px}
.bubble .row .btn{min-height:34px;font-size:14px;padding:4px 8px}
.hp{height:8px;background:#ddd;border:1px solid #888;margin-top:6px}.hp i{display:block;height:100%}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:30;display:flex;align-items:center;justify-content:center}.lb img{max-width:100%;max-height:100%}
